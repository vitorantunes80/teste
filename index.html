<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Simulador de Apoios Associativos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8;--surface:#fff;--ink:#16202b;--ink2:#465263;--muted:#7a8696;
  --line:#e2e7ed;--line2:#eef1f5;--soft:#f7f9fb;
  --accent:#1d5c8f;--accent-d:#154870;--accent-l:#e9f1f9;
  --ok:#1d7a4b;--ok-l:#e5f4ec;--warn:#9a5d07;--warn-l:#fdf3e1;--bad:#b3362c;--bad-l:#fbeceb;
  --r:12px;--sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
.fin-nota{display:block;margin-top:6px;padding:6px 9px;border-radius:8px;background:#eef4fb;color:#1f3b5a;font-size:12px;line-height:1.4}
.fin-warn{margin:6px 0 10px;padding:8px 11px;border-radius:9px;background:#fff4e5;color:#8a4b00;border:1px solid #f5c88a;font-size:12.5px;line-height:1.4}
/* ===== Cenários (painel de vidro) ===== */
.cen{position:relative;overflow:hidden;border-radius:22px;padding:22px;color:#eef2f7;background:#0e131b;isolation:isolate;margin-bottom:16px}
.cen::before,.cen::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
.cen::before{width:520px;height:520px;left:-140px;top:-180px;background:radial-gradient(circle,#2f6fb0 0%,transparent 65%)}
.cen::after{width:480px;height:480px;right:-160px;bottom:-200px;background:radial-gradient(circle,#7b5bb5 0%,transparent 65%)}
.cen .blob3{position:absolute;z-index:-1;width:360px;height:360px;left:45%;top:30%;border-radius:50%;filter:blur(80px);opacity:.35;background:radial-gradient(circle,#c98f16 0%,transparent 65%);pointer-events:none}
.cen h2{margin:0;font-size:22px;letter-spacing:-.01em;color:#fff}
.cen .cen-sub{color:rgba(238,242,247,.65);margin:4px 0 0;font-size:13.5px}
.cen-head{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.cen-chips{display:flex;gap:6px;flex-wrap:wrap}
.cen-chip{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:rgba(238,242,247,.85);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,border-color .2s,transform .2s}
.cen-chip:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.cen-chip.on{background:#fff;color:#0e131b;border-color:#fff;font-weight:600}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.13);border-radius:18px;backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:0 8px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.cen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cen-card{padding:16px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;position:relative;opacity:0;animation:cenUp .6s cubic-bezier(.2,.8,.2,1) forwards}
.cen-card:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1)}
.cen-card.on{border-color:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(255,255,255,.35),0 16px 40px rgba(0,0,0,.35)}
.cen-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.1);margin-bottom:10px;font-size:16px}
.cen-card h3{margin:0 0 3px;font-size:15px;color:#fff}
.cen-card p{margin:0 0 12px;font-size:12.5px;color:rgba(238,242,247,.62);min-height:34px}
.cen-k{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cen-k div{background:rgba(0,0,0,.18);border-radius:10px;padding:8px 10px}
.cen-k small{display:block;font-size:11px;color:rgba(238,242,247,.55);text-transform:uppercase;letter-spacing:.04em}
.cen-k b{font-size:15px;font-variant-numeric:tabular-nums;color:#fff}
.cen-badge{position:absolute;top:14px;right:14px;font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(52,211,153,.18);color:#6ee7b7;border:1px solid rgba(110,231,183,.3)}
.cen-tbl{margin-top:14px;padding:6px 6px 8px;opacity:0;animation:cenUp .7s .35s cubic-bezier(.2,.8,.2,1) forwards}
.cen-tbl table{width:100%;border-collapse:collapse;font-size:13px}
.cen-tbl th{color:rgba(238,242,247,.55);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:10px 10px;white-space:nowrap}
.cen-tbl th:first-child,.cen-tbl td:first-child{text-align:left}
.cen-tbl td{padding:10px;border-top:1px solid rgba(255,255,255,.07);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:rgba(238,242,247,.9)}
.cen-tbl td:first-child{white-space:normal;min-width:150px;color:#fff}
.cen-tbl tr:hover td{background:rgba(255,255,255,.04)}
.cen-tbl .col-on{background:rgba(255,255,255,.07)}
.cen-tbl .zero{color:rgba(238,242,247,.35)}
.cen-bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.cen-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#60a5fa,#a78bfa);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.cen-foot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding:14px 16px;opacity:0;animation:cenUp .7s .5s cubic-bezier(.2,.8,.2,1) forwards}
.cen-foot p{margin:0;font-size:13px;color:rgba(238,242,247,.75);max-width:640px}
.cen-btn{border:0;border-radius:11px;padding:10px 16px;font-weight:600;background:#fff;color:#0e131b;cursor:pointer;transition:transform .2s,box-shadow .2s}
.cen-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,255,255,.15)}
.cen-btn:disabled{opacity:.4;cursor:default;transform:none}
.cen-empty{padding:30px;text-align:center;color:rgba(238,242,247,.7)}
.cen-lay{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.cen-side{padding:8px;position:sticky;top:12px;display:flex;flex-direction:column;gap:4px}
.cen-side .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:rgba(238,242,247,.5);padding:8px 10px 4px}
.cen-it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;color:rgba(238,242,247,.82);padding:9px 10px;border-radius:12px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s;font:inherit}
.cen-it:hover{background:rgba(255,255,255,.07);transform:translateX(2px)}
.cen-it.on{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff}
.cen-it .cen-ic{margin:0;width:30px;height:30px;flex:none;font-size:14px}
.cen-it.on .cen-ic{background:#fff;color:#0e131b}
.cen-it b{display:block;font-size:13.5px;font-weight:600}
.cen-it small{display:block;font-size:11.5px;color:rgba(238,242,247,.55);font-variant-numeric:tabular-nums}
.cen-main{min-width:0;display:flex;flex-direction:column;gap:12px}
.cen-mh{padding:16px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;opacity:0;animation:cenUp .5s cubic-bezier(.2,.8,.2,1) forwards}
.cen-mh h3{margin:0;font-size:19px;color:#fff}.cen-mh p{margin:3px 0 0;font-size:13px;color:rgba(238,242,247,.65);max-width:620px}
.cen-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cen-kpi{padding:14px 16px;opacity:0;animation:cenUp .55s cubic-bezier(.2,.8,.2,1) forwards}
.cen-kpi small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:rgba(238,242,247,.55)}
.cen-kpi b{display:block;font-size:21px;margin-top:4px;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cen-kpi em{font-style:normal;font-size:12px;color:rgba(238,242,247,.55)}
.cen-seg{display:inline-flex;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:3px}
.cen-seg button{border:0;background:none;color:rgba(238,242,247,.7);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.cen-seg button.on{background:rgba(255,255,255,.16);color:#fff}
.cen-up{color:#6ee7b7}.cen-dn{color:#fca5a5}.cen-eq{color:rgba(238,242,247,.4)}
.cen-tbl.det td:nth-child(3){min-width:170px}
.cen-tbl.det{animation-duration:.45s;animation-delay:.12s!important}
@media (max-width:720px){.cen-tbl.det th:nth-child(4),.cen-tbl.det td:nth-child(4){display:none}.cen-tbl.det td:nth-child(3){min-width:110px}.cen-tbl td:first-child{min-width:110px}.cen-tbl th,.cen-tbl td{padding:9px 7px}.cen-mh .cen-btn{width:100%}}
.cen-kbd{font-size:11px;color:rgba(238,242,247,.45);padding:8px 10px 4px}
@media (max-width:900px){.cen-lay{grid-template-columns:1fr}.cen-side{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:6px}.cen-side .lbl,.cen-kbd{display:none}.cen-it{flex:none;width:auto;padding:8px 12px 8px 8px}.cen-it small{display:none}.cen-kpis{grid-template-columns:1fr 1fr}.cen-kpi b{font-size:17px}}
.cen-par{padding:14px 18px;opacity:0;animation:cenUp .45s .05s cubic-bezier(.2,.8,.2,1) forwards}
.cen-pl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:rgba(238,242,247,.6);margin-bottom:8px}
.cen-ph{font-size:12px;color:rgba(238,242,247,.55);margin:8px 0 0}
.cen-rng{display:flex;gap:14px;align-items:center}
.cen-rng input[type=range]{flex:1;accent-color:#a78bfa;height:28px;min-width:0}
.cen-num{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:0 10px;height:38px}
.cen-num input{width:84px;background:none;border:0;color:#fff;font:inherit;font-size:15px;font-weight:600;text-align:right;outline:none;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.cen-num input::-webkit-inner-spin-button{opacity:.4}
.cen-num span{color:rgba(238,242,247,.55);font-size:12.5px}
.cen-num:focus-within{border-color:rgba(167,139,250,.8)}
.cen-esc{display:flex;flex-direction:column;gap:6px;max-width:460px}
.cen-esc-r{display:grid;grid-template-columns:1fr 1fr 32px;gap:8px;align-items:center}
.cen-esc-r.hd span{font-size:11px;color:rgba(238,242,247,.5)}
.cen-esc-r .cen-num input{width:100%}
.cen-x{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:rgba(238,242,247,.7);cursor:pointer;font-size:17px;line-height:1}
.cen-x:hover{background:rgba(252,165,165,.15);color:#fca5a5}
.cen-adj{font-size:12.5px;padding:7px 12px}
.cen-pr{border-top:1px solid rgba(255,255,255,.07);padding:12px 0}
.cen-pl+.cen-pr{border-top:0}
.cen-pr.dis b{opacity:.5}
.cen-pc{margin-top:10px;display:flex}
.cen-pc .cen-rng{flex:1}
.cen-sw{display:flex;align-items:center;gap:10px;cursor:pointer;margin:0;position:relative}
.cen-sw input{position:absolute;opacity:0;width:1px;height:1px}
.cen-sw span{width:38px;height:22px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.cen-sw span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.cen-sw input:checked+span{background:#7c6cf0}
.cen-sw input:checked+span::after{transform:translateX(16px)}
.cen-sw input:focus-visible+span{outline:2px solid #a78bfa;outline-offset:2px}
.cen-sw b{font-size:14px;color:#fff;font-weight:600}
.cen-pr .cen-ph{margin:6px 0 0 48px}
@media (max-width:720px){.cen-pr .cen-ph{margin-left:0}.cen-num input{width:64px}}
.cen-pes{display:flex;flex-direction:column;gap:2px}
.cen-pes-r{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:10px;align-items:center;padding:7px 8px;border-radius:10px}
.cen-pes-r.on{background:rgba(124,108,240,.14)}
.cen-pes-r.hd span{font-size:11px;color:rgba(238,242,247,.5)}
.cen-pes-n{font-size:13.5px;color:#fff}
.cen-pes-m{text-align:right;font-variant-numeric:tabular-nums;color:rgba(238,242,247,.7);font-size:13px}
.cen-pes-c{display:flex;gap:4px;align-items:center}
.cen-q{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:rgba(238,242,247,.8);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;cursor:pointer;min-width:36px}
.cen-q:hover{background:rgba(255,255,255,.12)}
.cen-q.on{background:#fff;color:#0e131b;border-color:#fff;font-weight:700}
.cen-num-s{height:32px;padding:0 8px}.cen-num-s input{width:44px;font-size:13.5px}
@media (max-width:720px){.cen-pes-r{grid-template-columns:1fr auto;grid-template-areas:"n m" "c c"}.cen-pes-r.hd{display:none}.cen-pes-n{grid-area:n}.cen-pes-m{grid-area:m}.cen-pes-c{grid-area:c;flex-wrap:wrap}}
body.mod-cen .wrap{max-width:none;padding:12px 16px 24px}
body.mod-cen .cen{margin-bottom:0;min-height:calc(100svh - 128px)}
.cen-lay.min{grid-template-columns:64px minmax(0,1fr)}
.cen-lay.min .cen-it>span:last-child,.cen-lay.min .cen-side .lbl,.cen-lay.min .cen-kbd{display:none}
.cen-lay.min .cen-it{justify-content:center;padding:9px 0}
.cen-tog{border:0;background:none;color:rgba(238,242,247,.55);cursor:pointer;font:inherit;font-size:12px;padding:6px 10px;border-radius:9px;text-align:left}
.cen-tog:hover{background:rgba(255,255,255,.07);color:#fff}
@media (max-width:900px){.cen-tog{display:none}.cen-lay.min{grid-template-columns:1fr}.cen-lay.min .cen-it>span:last-child{display:block}}
.cen-pick{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;opacity:0;animation:cenUp .45s .05s cubic-bezier(.2,.8,.2,1) forwards}
.cen-pick .cen-chips{flex:1}
.cen-ck{font-size:12.5px;padding:6px 11px}
.cen-ck:not(.on){opacity:.6;text-decoration:line-through;text-decoration-color:rgba(238,242,247,.35)}
@media (max-width:720px){.cen-pick .cen-chips{flex-wrap:wrap;margin:0;padding:0}}
.cen-exp{all:unset;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;color:#fff}
.cen-exp:hover{text-decoration:underline;text-decoration-color:rgba(255,255,255,.35)}
.cen-exp:focus-visible{outline:2px solid #a78bfa;outline-offset:2px;border-radius:4px}
.cen-car{display:inline-block;transition:transform .2s;color:rgba(238,242,247,.6);font-size:11px}
.cen-car.on{transform:rotate(90deg)}
.cen-ni{font-size:11px;color:rgba(238,242,247,.5);font-weight:400}
.cen-tbl tr.cen-ir td{font-size:12.5px;color:rgba(238,242,247,.72);background:rgba(0,0,0,.14);padding-top:7px;padding-bottom:7px}
.cen-tbl tr.cen-ir td:first-child{padding-left:30px;color:rgba(238,242,247,.82)}
.cen-expall{all:unset;cursor:pointer;margin-left:8px;font-size:11px;text-transform:none;letter-spacing:0;color:#c4b5fd}
.cen-expall:hover{color:#fff}
.cen-verba{display:block;margin-top:3px;font-size:10.5px;font-weight:500;text-transform:none;letter-spacing:0;color:rgba(238,242,247,.45)}
.cen-tbl tr.cen-tot td{color:rgba(238,242,247,.7);border-top:1px solid rgba(255,255,255,.14)}
.cen-kpis.cen-k5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.cen-kpis.cen-k5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.cen-kpis.cen-k5{grid-template-columns:1fr 1fr}}
.cen-fe{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px}
.cen-fe label{display:flex;align-items:center;gap:6px;margin:0;font-size:11px;color:rgba(238,242,247,.55)}
.cen-fe .cen-num-s input{width:80px}
.cen-it small.cen-res{color:rgba(238,242,247,.68);line-height:1.3;margin:2px 0 3px;white-space:normal}
.cen-it.on small.cen-res{color:rgba(238,242,247,.85)}
.cen-fbtn{color:rgba(238,242,247,.88)}
.cen-conta{margin-top:7px;font-size:11.5px;color:rgba(238,242,247,.75);line-height:1.5}
.cen-warn{margin-top:7px;padding:7px 10px;border-radius:9px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:#fcd34d;font-size:11.5px;line-height:1.4;white-space:normal}
.cen-wtag{font-size:11px;color:#fcd34d;margin-left:4px}
.cen-br{font-size:10.5px;color:rgba(238,242,247,.5);margin-top:2px;white-space:nowrap}
@keyframes cenUp{from{opacity:0;transform:translateY(18px) scale(.98);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@media (max-width:720px){.cen{padding:16px;border-radius:18px;margin-left:-4px;margin-right:-4px}.cen h2{font-size:19px}.cen-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}.cen-chip{white-space:nowrap;flex:none}.cen-grid{grid-template-columns:1fr 1fr}.cen-card{padding:12px}.cen-card p{min-height:0}.cen-k b{font-size:14px}}
@media (max-width:560px){.cen-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.cen-card,.cen-tbl,.cen-foot{animation:none;opacity:1}.cen-bar i{transition:none}}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:16px}h3{font-size:15px}h4{font-size:13.5px}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:12.5px}
.n,.money,.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Login */
#login{min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 600px at 50% -10%,#e3edf7 0,var(--bg) 60%)}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(16,24,40,.08);padding:30px 26px}
.brand-mark{width:44px;height:44px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff;margin-bottom:16px}
.brand-mark svg{width:24px;height:24px;stroke:#fff}
.login-card h1{font-size:20px;margin-bottom:4px}
.login-card form{margin-top:22px;display:grid;gap:12px}
.login-err{color:var(--bad);font-size:13px;min-height:18px}

/* Layout */
.head{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;white-space:nowrap}
.brand .brand-mark{width:30px;height:30px;border-radius:8px;margin:0}
.brand .brand-mark svg{width:17px;height:17px}
.simbtn{display:flex;align-items:center;gap:8px;min-width:0;flex:1;max-width:460px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--soft);cursor:pointer;margin-left:8px}
.simbtn:hover{border-color:#cdd5df}
.sb-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.sb-a{color:var(--muted);font-size:12.5px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.save{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;padding:0 6px}
.save .dot{width:7px;height:7px;border-radius:50%;background:#c3ccd6}
.save.ok .dot{background:var(--ok)}.save.pend .dot{background:#d29a22}.save.err{color:var(--bad);cursor:pointer}.save.err .dot{background:var(--bad)}
.save.busy .dot{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.tabs{display:flex;gap:4px;padding:0 12px;max-width:1280px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:11px 12px 12px;font-weight:550;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab .tn{width:20px;height:20px;border-radius:50%;background:var(--line2);color:var(--ink2);font-size:11.5px;display:grid;place-items:center;font-weight:650}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab.on .tn{background:var(--accent);color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:22px 16px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin-top:4px}

/* Cards & controls */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-h p{margin-top:3px}
.card-f{border-top:1px solid var(--line2);margin-top:14px;padding-top:12px;font-size:13px;color:var(--ink2);display:flex;gap:18px;flex-wrap:wrap}
.kicker{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:550;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--soft);border-color:#cfd7e0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;color:var(--ink2)}
.icon-btn:hover{background:var(--line2);color:var(--ink)}
.icon-btn.del:hover{color:var(--bad);background:var(--bad-l)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--ink2)}
.field small{color:var(--muted);font-size:12px}
.inp,.field input,.field select,.field textarea,select.inp{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 10px;outline:none;transition:border-color .12s,box-shadow .12s}
.field textarea{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.field input[type=radio],.field input[type=checkbox]{width:16px;height:16px;padding:0;flex:none;box-shadow:none}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus,.pct-in input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,92,143,.14)}
fieldset.fs{border:0;margin:0;padding:0;min-width:0}
fieldset.fs:disabled input,fieldset.fs:disabled select,fieldset.fs:disabled textarea{background:var(--soft);color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;background:var(--line2);color:var(--ink2);font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.lock{background:var(--warn-l);color:var(--warn)}
.chip.lock svg{width:12px;height:12px}
.chip.cur{background:var(--accent-l);color:var(--accent)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:650;white-space:nowrap}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.badge.no{background:var(--bad-l);color:var(--bad)}
.note{background:var(--accent-l);color:var(--accent-d);padding:10px 12px;border-radius:8px;font-size:13px;margin:10px 0}
.note.warn{background:var(--warn-l);color:var(--warn)}
.note.bad{background:var(--bad-l);color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.empty{text-align:center;padding:48px 20px;color:var(--ink2)}
.empty h2{margin-bottom:6px}
.empty .btn{margin-top:16px}
.seg{display:inline-flex;background:var(--line2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;height:32px;padding:0 14px;border-radius:7px;font-weight:550;cursor:pointer;color:var(--ink2);font-size:13.5px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Range */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;margin:0;--c:var(--accent);--p:50%}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(to right,var(--c) 0,var(--c) var(--p),#dde3ea var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--c);margin-top:-7px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(29,92,143,.2)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:#dde3ea}
input[type=range]::-moz-range-progress{height:6px;border-radius:99px;background:var(--c)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--c)}
input[type=range]:disabled{opacity:.5;cursor:default}
.pct-in{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;height:36px;background:#fff;overflow:hidden}
.pct-in input{border:0;outline:none;width:100%;height:100%;padding:0 4px 0 9px;text-align:right;background:transparent;font-variant-numeric:tabular-nums;min-width:0}
.pct-in span{padding:0 9px 0 3px;color:var(--muted);font-size:12.5px}
fieldset.fs:disabled .pct-in{background:var(--soft)}

/* Config */
.cfg-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cfg-2>.card{margin-bottom:0}
.cfg-stack{display:grid;gap:16px;margin-bottom:16px}
.verba{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:18px;align-items:end}
.verba-v{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding-bottom:2px}
.stack-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line2);margin-bottom:8px}
.stack-bar i{display:block;height:100%;transition:width .15s}
.sum-line{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:10px}
.area-row{display:grid;grid-template-columns:30px minmax(120px,1.1fr) minmax(140px,2fr) 96px 132px 32px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}
.swatch{width:26px;height:26px;border:1px solid var(--line);border-radius:7px;padding:0;background:none;cursor:pointer}
.swatch::-webkit-color-swatch-wrapper{padding:2px}.swatch::-webkit-color-swatch{border:0;border-radius:5px}
.area-row .money{text-align:right;font-weight:600}
.split-vis{display:flex;height:42px;border-radius:9px;overflow:hidden;margin-bottom:10px;font-size:13px}
.split-vis>div{display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;overflow:hidden;transition:width .15s}
.sv-fix{background:var(--accent);color:#fff}
.sv-var{background:#cfe0f0;color:var(--accent-d);flex:1}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.presets span{font-size:12.5px;color:var(--muted);margin-right:4px}
.opt{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:8px;align-items:flex-start}
.opt:hover{border-color:#cdd5df}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt b{display:block;font-weight:600;font-size:13.5px}
.opt small{color:var(--ink2);font-size:12.5px;display:block;margin-top:2px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-l)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:550;margin-bottom:12px}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .tg{width:38px;height:22px;border-radius:99px;background:#cfd6df;position:relative;transition:background .15s;flex:none}
.switch .tg::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+.tg{background:var(--accent)}
.switch input:checked+.tg::after{transform:translateX(16px)}
.switch input:focus-visible+.tg{box-shadow:0 0 0 3px rgba(29,92,143,.2)}
.is-off{opacity:.45}
.rrow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(120px,1.5fr) 100px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}
.rrow:first-of-type{border-top:0}
.rrow-l b{display:block;font-size:13.5px;font-weight:600}
.rrow-l small{color:var(--muted);font-size:12px}
.lim-ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.crit-row{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line2)}
.crit-row:first-child{border-top:0}
.cr-main{flex:1;min-width:0}
.cr-main b{font-weight:600}
.cr-main small{display:block;color:var(--muted);font-size:12.5px}
.cr-subs{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.cr-max{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:64px;text-align:right}
.cr-act{display:flex;gap:2px}
.maxtab{width:100%;border-collapse:collapse;font-size:13px}
.maxtab td,.maxtab th{padding:7px 8px;border-bottom:1px solid var(--line2);text-align:left}
.maxtab .n{text-align:right}
.maxtab th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}

/* Editor de critérios */
.sub-ed{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--soft)}
.sub-top{display:grid;grid-template-columns:minmax(0,1fr) 170px 110px 32px 32px 32px;gap:8px;align-items:center}
.sub-top .smax{font-size:12.5px;color:var(--ink2);white-space:nowrap;text-align:center}
.levels{margin-top:10px;display:grid;gap:6px}
.lvl{display:grid;grid-template-columns:minmax(0,1fr) 96px 32px;gap:8px;align-items:center}
.lvl-h{display:grid;grid-template-columns:minmax(0,1fr) 96px 32px;gap:8px;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ed-sec{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}

/* Associações */
.assoc-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.list-panel{position:sticky;top:118px;padding:12px;margin:0}
.filters{display:grid;gap:8px;margin-bottom:10px}
.alist{max-height:calc(100svh - 300px);overflow:auto;margin:0 -4px;padding:0 4px;overscroll-behavior:contain}
.aitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:8px;cursor:pointer}
.aitem:hover{background:var(--soft)}
.aitem.on{background:var(--accent-l)}
.aitem .dot{width:8px;height:8px;border-radius:50%;flex:none}
.ai-n{flex:1;min-width:0;font-weight:500}.ai-t{display:block;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.aitem{align-items:flex-start}.aitem .dot{margin-top:5px}.aitem .ai-e{margin-top:5px}
.ai-p{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.ai-e{width:8px;height:8px;border-radius:2px;flex:none}
.ai-e.ok{background:var(--ok)}.ai-e.no{background:var(--bad)}
.list-foot{font-size:12px;color:var(--muted);padding:8px 4px 2px;border-top:1px solid var(--line2);margin-top:8px}
.score-sum{position:sticky;top:118px;z-index:5;padding:12px 16px}
.ss-eq{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1.15fr);align-items:center;gap:6px}
.ss-op{font-size:22px;font-weight:600;color:var(--muted);text-align:center}
.ss-b{padding:8px 10px;border-radius:9px;background:var(--soft)}
.ss-b.tot{background:var(--accent-l)}.ss-b.tot .ss-v{color:var(--accent-d)}
.ss-f{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.ss-sum{font-family:var(--mono);font-size:12.5px;color:var(--ink2);background:var(--soft);border-radius:6px;padding:3px 8px}
.ss-f .ss-mot{flex:1 1 100%;margin:0}
.sub-tot{justify-content:space-between;align-items:center}
.sub-tot b{font-variant-numeric:tabular-nums;color:var(--ink)}
.sub-tot.final{border-top:2px solid var(--line);margin-top:8px;font-size:14px}
.sub-tot.final b{color:var(--accent-d)}
.ss-v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ss-v small{font-size:12.5px;color:var(--muted);font-weight:500}
.ss-l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ss-mot{font-size:12px;color:var(--bad);margin-top:3px}
.cs{padding:12px 0;border-top:1px solid var(--line2)}
.cs:first-of-type{border-top:0;padding-top:0}
.cs-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:8px}
.cs-h b{font-weight:600}
.cs-p{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink2)}
.cs-p b{color:var(--ink);font-size:15px}
.cs-sub{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;margin-top:6px}
.cs-sub.single{grid-template-columns:1fr}
.cs-sn{font-size:13px;color:var(--ink2)}
.cs-sn small{color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;margin-top:12px}
.check input{width:16px;height:16px;accent-color:var(--accent)}

/* Tabelas & resultados */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl .n{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:650;border-bottom:0;border-top:1px solid var(--line)}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:var(--soft)}
.tbl tr.cur td{background:#f5f9fd}
.tbl td.acts{white-space:nowrap;text-align:right}
.tbl .chev{transition:transform .15s;color:var(--muted)}
.tbl tr.open .chev{transform:rotate(90deg)}
.detail-row td{background:var(--soft);padding:12px 14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-size:21px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi small{color:var(--muted);font-size:12px}
.card .kpis .kpi{box-shadow:none;background:var(--soft)}
.ar-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ar-h .dot{width:12px;height:12px;border-radius:4px}
.ar-h .ar-v{margin-left:auto;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.calc-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.calc-box>div{background:var(--soft);border:1px solid var(--line2);border-radius:9px;padding:10px 12px}
.calc-box span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.calc-box b{display:block;font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px}
.calc-box small{display:block;font-size:12px;color:var(--ink2);font-family:var(--mono);margin-top:2px}
.calc-lines{display:grid;gap:7px}
.calc-lines>div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:baseline}
.calc-lines span{font-size:12.5px;color:var(--ink2);font-weight:600}
.calc-lines code{font-family:var(--mono);font-size:12.5px;background:#fff;border:1px solid var(--line2);border-radius:6px;padding:5px 8px;display:block;white-space:normal;word-break:break-word}
.calc-lines .tot code{border-color:var(--accent);background:var(--accent-l);color:var(--accent-d);font-weight:500}
.calc-pts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pbar{display:inline-block;width:56px;height:6px;border-radius:99px;background:var(--line2);vertical-align:middle;margin-right:8px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px}
.formula{font-family:var(--mono);font-size:12.5px;background:var(--soft);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;line-height:1.8}
details.ne{margin-top:12px;border:1px solid var(--line2);border-radius:9px;padding:0 12px}
details.ne summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:13.5px;color:var(--ink2)}
details.ne ul{margin:0 0 12px;padding-left:18px;font-size:13px}
details.ne li{margin-bottom:5px}
.delta{font-size:12px;font-weight:600;display:block}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}.delta.eq{color:var(--muted)}
.rp-menu{padding-top:14px;border-top:1px solid var(--line2)}.rp-menu-t{font-size:14px;margin:0 0 10px}
.rp-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:760px){.rp-tiles{grid-template-columns:1fr}}
.rp-tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--bg2,#fafbfc)}
.rp-tile-h{display:flex;gap:10px;align-items:flex-start}.rp-tile-h>.i{width:20px;height:20px;flex:none;color:var(--accent,#1d5c8f);margin-top:1px}.rp-tile-h b{display:block;font-size:14px}.rp-tile-h small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:2px}
.rp-tile-a{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}.rp-tile-a select{flex:1 1 100%;min-width:0}.rp-tile-a .btn{flex:1 1 auto}
.report-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line2)}
.report-bar b{margin-right:6px;font-size:13.5px}
.report-bar .inline{display:flex;gap:8px;flex:1;min-width:260px}
.report-bar .inline select{min-width:150px}
.report-bar select{flex:1;min-width:0}

/* Modais e avisos */
#modals .mback{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:fade .12s}
@keyframes fade{from{opacity:0}}

function guardar(){
  clearTimeout(S.timer);
  if(!S.sim||bloq()||!S.dirty)return Promise.resolve(true);
  if(S.saving){S.again=true;return S.savingP}
  S.saving=true;S.dirty=false;setSave('busy');const sim=S.sim;
  S.savingP=(async()=>{
    try{
      const r=await rpc('guardar_simulacao',{p_codigo:S.codigo,p_id:sim.id,p_nome:(sim.nome||'').trim()||'Simulação sem nome',p_descricao:sim.descricao||null,p_ano:sim.ano?parseInt(sim.ano,10)||null:null,p_dados:sim.dados,p_resultados:calcular(sim.dados)});
      sim.atualizado_em=r.atualizado_em;atualizarLista(r);setSave(S.dirty?'pend':'ok');return true;
    }catch(e){S.dirty=true;setSave('err',e.message);if(e.code==='28000')erro(e);return false}
    finally{S.saving=false;if(S.again){S.again=false;if(S.dirty)setTimeout(guardar,50)}}
  })();
  return S.savingP;
}

function cfgPesos(d){if(!usaSub(d))return '';const us=[];d.areas.forEach(ar=>subsDe(d,ar).filter(subMulti).forEach(s=>{const cs=critsDe(d,'especifico',ar.id,s.id);if(cs.length&&num(ar.pct)*num(s.pct)>0)us.push({ar,s,cs})}));if(!us.length)return '';

function cfgLimiar(d){if(!usaSub(d))return '';const on=limiarOn(d);const us=[];d.areas.forEach(ar=>subsDe(d,ar).forEach(s=>{if(num(ar.pct)*num(s.pct)>0)us.push({ar,s})}));if(!us.length)return '';

/* Editor de critério */
function editarCriterio(id,grupo,areaId,subId){
  const d=D();const orig=id?d.criterios.find(c=>c.id===id):null;
  const E=orig?JSON.parse(JSON.stringify(orig)):crit('',grupo,areaId,[{id:uid(),nome:'',tipo:'niveis',max:null,niveis:nv([['',0],['',0]])}]);
  if(!orig&&subId)E.subareaId=subId;
  const area=areaDe(E.areaId);
  const m=modal({title:(orig?'Editar critério':'Novo critério')+(E.grupo==='geral'?' geral':' específico — '+(area?area.nome:'')+(E.subareaId?' · '+subNome(D(),E.subareaId):'')),wide:true,actions:[{label:'Cancelar'},{label:'Guardar critério',cls:'primary',onClick:()=>{
    if(!E.nome.trim()){toast('Indique o nome do critério.','erro');return false}
    if(!E.subs.length){toast('O critério precisa de pelo menos um subcritério.','erro');return false}
    E.nome=E.nome.trim();
    E.subs.forEach((s,i)=>{s.nome=(s.nome||'').trim()||(E.subs.length===1?E.nome:'Subcritério '+(i+1));if(s.tipo==='niveis'){s.niveis=s.niveis.filter((n,j)=>n.rotulo.trim()||num(n.pontos)!==0||s.niveis.length===1);if(!s.niveis.length)s.niveis=[{id:uid(),rotulo:'',pontos:0}];s.niveis.forEach((n,j)=>{n.rotulo=n.rotulo.trim()||('Nível '+(j+1));n.pontos=num(n.pontos)})}else{s.max=Math.max(0,num(s.max))}});
    if(orig)Object.assign(orig,E);else d.criterios.push(E);
    marcar();render();toast('Critério guardado.');
  }}]});
  const body=m.querySelector('.m-b');
  const draw=()=>{
    body.innerHTML='<div class="grid2"><label class="field"><span>Nome do critério</span><input data-e="nome" value="'+esc(E.nome)+'" placeholder="Ex.: Formação desportiva"></label>'+
      '<label class="field"><span>Pontuação máxima do critério</span><input type="number" inputmode="decimal" min="0" step="any" data-e="max" value="'+(critTemCap(E)?num(E.max):'')+'" placeholder="Soma dos subcritérios"><small data-eo="soma">Soma dos subcritérios: '+pts(critSoma(E))+' pts</small></label></div>'+
      '<div class="grid2"><label class="field"><span>Descrição (opcional)</span><input data-e="descricao" value="'+esc(E.descricao||'')+'" placeholder="'+esc(DESC_PADRAO[nfKey(E.nome||'')]||'Breve explicação do critério')+'"></label>'+
      '<label class="field"><span>Pontuação mínima para elegibilidade</span><input type="number" inputmode="decimal" min="0" step="any" data-e="min" value="'+num(E.min)+'"><small>0 = sem mínimo neste critério</small></label></div>'+
      '<div class="ed-sec"><h4>Subcritérios</h4><button type="button" class="btn sm" data-ea="subAdd">'+IC.plus+' Subcritério</button></div>'+
      E.subs.map((s,i)=>'<div class="sub-ed"><div class="sub-top"><input class="inp sn" data-e="s.nome" data-i="'+i+'" value="'+esc(s.nome)+'" placeholder="Nome do subcritério">'+
        '<select class="inp" data-e="s.tipo" data-i="'+i+'"><option value="niveis" '+(s.tipo==='niveis'?'selected':'')+'>Níveis predefinidos</option><option value="valor" '+(s.tipo==='valor'?'selected':'')+'>Valor livre</option></select>'+
        '<div class="smax-w">'+(s.tipo==='valor'?'<div class="pct-in"><input type="number" inputmode="decimal" min="0" step="any" data-e="s.max" data-i="'+i+'" value="'+num(s.max)+'"><span>máx.</span></div>':'<div class="smax" data-eo="smax:'+i+'">máx. '+pts(subMax(s))+' pts</div>')+'</div>'+
        '<button type="button" class="icon-btn" data-ea="subMove" data-i="'+i+'" data-dir="-1" '+(i===0?'disabled':'')+' title="Subir">'+IC.up+'</button><button type="button" class="icon-btn" data-ea="subMove" data-i="'+i+'" data-dir="1" '+(i===E.subs.length-1?'disabled':'')+' title="Descer">'+IC.down+'</button>'+
        '<button type="button" class="icon-btn del" data-ea="subDel" data-i="'+i+'" title="Remover">'+IC.trash+'</button></div>'+
        (s.tipo==='niveis'?'<div class="levels"><div class="lvl-h"><span>Nível / indicador</span><span>Pontos</span><span></span></div>'+s.niveis.map((n,j)=>'<div class="lvl"><input class="inp" data-e="n.rotulo" data-i="'+i+'" data-j="'+j+'" value="'+esc(n.rotulo)+'" placeholder="Descrição do nível"><input class="inp num" type="number" inputmode="decimal" step="any" data-e="n.pontos" data-i="'+i+'" data-j="'+j+'" value="'+num(n.pontos)+'"><button type="button" class="icon-btn del" data-ea="lvlDel" data-i="'+i+'" data-j="'+j+'" title="Remover nível">'+IC.x+'</button></div>').join('')+
          '<div><button type="button" class="btn sm ghost" data-ea="lvlAdd" data-i="'+i+'">'+IC.plus+' Nível</button></div></div>':'<p class="hint">A pontuação é introduzida diretamente, entre 0 e o máximo indicado.</p>')+'</div>').join('')+
      (E.subs.length?'':'<p class="muted">Adicione pelo menos um subcritério.</p>');
  };
  const upd=()=>{E.subs.forEach((s,i)=>{const o=body.querySelector('[data-eo="smax:'+i+'"]');if(o)o.textContent='máx. '+pts(subMax(s))+' pts'});const o=body.querySelector('[data-eo="soma"]');if(o)o.textContent='Soma dos subcritérios: '+pts(critSoma(E))+' pts'};
  body.addEventListener('input',e=>{const t=e.target,f=t.dataset.e;if(!f)return;const i=+t.dataset.i,j=+t.dataset.j,v=t.value;
    switch(f){case 'nome':E.nome=v;break;case 'descricao':E.descricao=v;break;case 'max':E.max=v===''?null:Math.max(0,num(v));break;case 'min':E.min=Math.max(0,num(v));break;
      case 's.nome':E.subs[i].nome=v;break;case 's.max':E.subs[i].max=Math.max(0,num(v));break;case 'n.rotulo':E.subs[i].niveis[j].rotulo=v;break;case 'n.pontos':E.subs[i].niveis[j].pontos=v;break}
    upd()});
  body.addEventListener('change',e=>{const t=e.target;if(t.dataset.e!=='s.tipo')return;const s=E.subs[+t.dataset.i];const mx=subMax(s);s.tipo=t.value;
    if(s.tipo==='valor'&&!num(s.max))s.max=mx||10;if(s.tipo==='niveis'&&!s.niveis.length)s.niveis=nv([['',0]]);draw()});
  body.addEventListener('click',e=>{const b=e.target.closest('[data-ea]');if(!b||b.disabled)return;const i=+b.dataset.i,j=+b.dataset.j,dir=+b.dataset.dir;

      case 'subAdd':E.subs.push({id:uid(),nome:'',tipo:'niveis',max:null,niveis:nv([['',0],['',0]])});break;
      case 'subDel':E.subs.splice(i,1);break;
      case 'subMove':{const k=i+dir;if(k<0||k>=E.subs.length)return;[E.subs[i],E.subs[k]]=[E.subs[k],E.subs[i]];break}
      case 'lvlAdd':E.subs[i].niveis.push({id:uid(),rotulo:'',pontos:0});break;
      case 'lvlDel':E.subs[i].niveis.splice(j,1);break;
    }draw();
    if(b.dataset.ea==='lvlAdd'){const ins=body.querySelectorAll('[data-e="n.rotulo"][data-i="'+i+'"]');ins.length&&ins[ins.length-1].focus()}
    if(b.dataset.ea==='subAdd'){const ins=body.querySelectorAll('[data-e="s.nome"]');ins.length&&ins[ins.length-1].focus()}
  });
  draw();
  if(!orig)setTimeout(()=>{const i=body.querySelector('[data-e="nome"]');i&&i.focus()},40);
}

function descDe(c){return (c.descricao&&c.descricao.trim())||DESC_PADRAO[nfKey(c.nome)]||''}
function critPenInfo(d,c,sub){if(c.grupo!=='especifico')return '';const out=[];(d.condicoes||[]).forEach(k=>{if(!k.ativo||nfKey(c.nome)!==k.crit||!condSubOk(d,k,sub))return;
  if(k.tipo==='niveis'){const sb=c.subs.find(z=>z.tipo==='niveis');if(!sb)return;out.push('Penalização na pontuação final: '+sb.niveis.map((l,i)=>esc(l.rotulo)+' <b>'+(condPctNivel(d,k,l.rotulo,i)>0?'−'+fmtN(condPctNivel(d,k,l.rotulo,i))+' %':'0 %')+'</b>').join(' · '))}
  else{const sb=c.subs.find(z=>z.tipo==='niveis');const nv=sb?sb.niveis.filter(l=>/^n[aã]o\b/i.test(String(l.rotulo).trim())||/^sim\b/i.test(String(l.rotulo).trim())):[];
    if(nv.length>2)out.push('Penalização na pontuação final: '+nv.map(l=>{const r=String(l.rotulo).trim();return esc(r.replace(/\s*\(.*\)\s*$/,''))+' <b>'+(/^n[aã]o$/i.test(r)?'−'+fmtN(num(k.pct))+' %':'0 %')+'</b>'}).join(' · '));
    else out.push('Penalização na pontuação final: Não <b>−'+fmtN(num(k.pct))+' %</b> · Sim <b>0 %</b>')}});
  return out.length?'<p class="cs-pen">'+IC.alert+out.join('<br>')+'</p>':''}
function critPontuar(c,a,sub,xid){const d=D();const XA=xid?' data-x="'+xid+'"':'',XO=xid?xid+':':'';
  const single=c.subs.length===1&&c.subs[0].nome===c.nome;

        :'<div class="pct-in"><input type="number" inputmode="decimal" min="0" max="'+subMax(s)+'" step="any" data-f="pt" data-k="'+s.id+'"'+XA+' value="'+(a.pontos[s.id]??'')+'" placeholder="0"><span>de '+pts(subMax(s))+' pts</span></div>')+'</div>').join('')+

function metodoTxt(m){return m==='acima_minimo'?'Proporcional à pontuação acima do mínimo':'Proporcional à pontuação (PFi ÷ ΣPF)'}
function iniLinhas(l){if(!l.inis)return '';return '<div><span>Iniciativas</span><code>'+l.inis.map(i=>esc(i.nome)+': '+(i.elegivel?pts(i.contrib/(i.peso||1))+' pts específicos'+(i.peso<0.9999?' × '+fmtN(i.peso*100,1)+' %':'')+' = <b>'+pts(i.contrib)+'</b>':'não elegível'+(i.motivos.length?' ('+esc(i.motivos[0])+')':''))).join('<br>')+'<br>Força da candidatura = PG '+pts(l.PG)+' (gerais, contados uma vez'+(l.pgW!=null&&l.pgW!==1?', com peso ×'+fmtN(l.pgW):'')+') + '+pts(l.PE)+' (soma das iniciativas) = <b>'+pts(l.PF)+'</b></code></div>'}
function finLinha(ar,l){if(!ar.fin||!l.finParts)return '';const P=l.finParts;if(!P.some(q=>q.com))return '<div><span>Pedido e custo</span><code>Sem pedido preenchido: mantém o valor calculado pela pontuação ('+eur(l.totalBase)+').</code></div>';

function detalheCalc(R,ar,l){let h=detalheCalc0(R,ar,l);if(l.inis)h=h.replace('<div class="calc-lines">','<div class="calc-lines">'+iniLinhas(l));if(ar.fin)h=h.replace('<div class="calc-lines">','<div class="calc-lines">'+finLinha(ar,l));return h}
function detalheCalc0(R,ar,l){
  const P=R.parametros;const fx=pct(P.f,1),vx=pct(P.v,1);
  let av;
  if(ar.igual)av='AV = MTA × '+vx+' ÷ N = '+eur(ar.MTA)+' × '+vx+' ÷ '+ar.N+' = '+eur(l.AV)+' (pontuações ponderadas nulas: repartição igual)';
  else if(ar.expo>1)av='AV = MTA × '+vx+' × PF'+(ar.limiar>0?' acima do limiar':'')+' elevado a '+fmtN(ar.expo)+' ÷ Σ = '+eur(ar.MTA)+' × '+vx+' × '+pts(l.w)+' ÷ '+pts(ar.sumW)+' = '+eur(l.AV);
  else if(ar.acima)av=(ar.limiar>0&&l.abaixo?'Pontuação igual ou abaixo do limiar de '+pts(ar.limiar)+' pts: sem apoio. ':'')+'AV = MTA × '+vx+' × (PF − '+(ar.limiar>0?'limiar':'Pmín')+') ÷ Σ(PF − '+(ar.limiar>0?'limiar':'Pmín')+') = '+eur(ar.MTA)+' × '+vx+' × ('+pts(l.PF)+' − '+pts(ar.base)+') ÷ '+pts(ar.sumW)+' = '+eur(l.AV);
  else av='AV = MTA × '+vx+' × PF ÷ ΣPF = '+eur(ar.MTA)+' × '+vx+' × '+pts(l.PF)+' ÷ '+pts(ar.sumPF)+' = '+eur(l.AV);
  if(ar.esc){const a2='<div class="calc-lines"><div><span>Pontuação final</span><code>'+(P.aj?'PF = '+pts(l.PG)+' + '+pts(l.PE)+ajTxt(l)+' = '+pts(l.PF):'PF = '+pts(l.PG)+' + '+pts(l.PE)+' = '+pts(l.PF))+'</code></div>'+
    '<div><span>Escalão de apoio</span><code>'+esc(l.esc)+' → '+eur(l.escValor)+'</code></div>'+(ar.escFator<1?'<div><span>Redução</span><code>Os escalões somam mais do que a verba da sub-área: todos os apoios × '+fmtN(ar.escFator*100,1)+' %</code></div>':'')+
    '<div class="tot"><span>Apoio total</span><code>AT = '+eur(l.total)+' · '+pct(l.pctArea)+' da sub-área</code></div></div>';return a2}
  let h='<div class="calc-lines"><div><span>Pontuação final</span><code>'+(P.aj?'PF = PG + PE'+(P.nf?' − penalização':'')+(P.cond?' − penalizações por critério':'')+' = '+pts(l.PG)+' + '+pts(l.PE)+ajTxt(l)+' = '+pts(l.PF)+(P.nf?' (apoios não financeiros: '+eur(l.nfValor)+')':'')+(l.pc>0?' ('+esc(condTxt(l))+')':''):'PF = PG + PE = '+pts(l.PG)+' + '+pts(l.PE)+' = '+pts(l.PF))+'</code></div>'+
    (P.f>0?'<div><span>Parcela fixa</span><code>AF = MTA × '+fx+' ÷ N = '+eur(ar.MTA)+' × '+fx+' ÷ '+ar.N+' = '+eur(l.AF)+'</code></div>':'')+
    '<div><span>'+(P.f>0?'Parcela variável':'Apoio calculado')+'</span><code>'+av+'</code></div>';
  if(l.red>0.0049)h+='<div><span>Redistribuição</span><code>Recebe '+eur(l.red)+' do excedente de associações que atingiram o limite (proporcional à pontuação'+(P.metodo==='acima_minimo'?' acima do mínimo':'')+')</code></div>';
  if(l.corte>0.0049)h+='<div><span>Limite máximo</span><code>'+(l.grpN>1?'Soma das '+l.grpN+' candidaturas da associação = '+eur(l.grpTot)+' &gt; limite de '+eur(ar.cap)+' ('+pct(ar.limPct,1)+' da sub-área) → corte de '+eur(l.corte)+' nesta candidatura, proporcional ao seu valor':(P.f>0?'AF + AV':'AV')+(l.red>0.0049?' + redistribuição':'')+' = '+eur(l.AF+l.AV+l.red)+' &gt; limite de '+eur(ar.cap)+' ('+pct(ar.limPct,1)+' da '+(ar.subNome?'sub-área':'área')+') → corte de '+eur(l.corte))+'</code></div>';
  h+='<div class="tot"><span>Apoio total</span><code>AT = '+(P.f>0?eur(l.AF)+' + ':'')+eur(l.AV)+(l.red>0.0049?' + '+eur(l.red):'')+(l.corte>0.0049?' − '+eur(l.corte):'')+' = '+eur(l.total)+' · '+pct(l.pctArea)+' da área · '+pct(l.pctVerba)+' da verba total</code></div></div>';
  return h;
}

  h+='<div class="fold-bar"><button class="btn sm ghost" onclick="resFoldAll(true)">Expandir tudo</button><button class="btn sm ghost" onclick="resFoldAll(false)">Recolher tudo</button></div>';

    S.resOpen=S.resOpen||new Set();

      '<div class="calc-box">'+(P.f>0?'<div><span>Parcela fixa</span><b>'+eur(a.fixoPool)+'</b><small>'+eur(a.MTA)+' × '+pct(P.f,1)+'</small></div>':'')+'<div><span>'+(P.f>0?'Parcela variável':'Verba a repartir por pontuação')+'</span><b>'+eur(a.varPool)+'</b><small>'+eur(a.MTA)+' × '+pct(P.v,1)+'</small></div>'+
      '<div><span>Elegíveis (N)</span><b>'+a.N+'</b><small>de '+a.nTotal+' registada'+(a.nTotal===1?'':'s')+'</small></div><div><span>Σ PF elegíveis</span><b>'+pts(a.sumPF)+'</b>'+(a.acima?'<small>Σ(PF − '+pts(a.base)+') = '+pts(a.sumW)+'</small>':'<small>soma das pontuações</small>')+'</div>'+

        '</tbody><tfoot><tr><td></td><td>Total da área</td><td></td><td></td>'+(P.aj?'<td></td>':'')+'<td class="n">'+pts(a.sumPF)+'</td><td class="n fx">'+eur(sum(a.linhas,l=>l.AF))+'</td><td class="n fx">'+eur(sum(a.linhas,l=>l.AV))+'</td><td class="n">'+eur(sum(a.linhas,l=>l.red-l.corte))+'</td><td class="n">'+eur(a.distribuido)+'</td><td class="n">'+pct(a.MTA?a.distribuido/a.MTA:0)+'</td><td></td></tr></tfoot></table></div>';
    }else h+='<p class="muted">Nenhuma associação elegível nesta área'+(a.MTA>0?': a verba da área fica por distribuir.':'.')+'</p>';
    if(a.passos.length)h+='<div class="note">'+a.passos.map(p=>'Limite aplicado (iteração '+p.it+'): '+p.novas.map(esc).join(', ')+' — excedente de '+eur(p.exc)+' '+(p.destino==='retido'?'fica por distribuir.':'redistribuído por '+p.n+' associação'+(p.n===1?'':'ões')+'.')).join('<br>')+'</div>';
    if(a.linhas.length&&a.porDistribuir>0.0049)h+='<div class="note warn">Por distribuir nesta área: <b>'+eur(a.porDistribuir)+'</b></div>';
    if(a.naoEleg.length)h+='<details class="ne"><summary>Não elegíveis ('+a.naoEleg.length+')</summary><ul>'+a.naoEleg.map(n=>'<li><b>'+esc(n.nome)+'</b> — PF '+pts(n.PF)+' (PG '+pts(n.PG)+' · PE '+pts(n.PE)+')<br><span class="muted">'+n.motivos.map(esc).join('; ')+'</span></li>').join('')+'</ul></details>';
    h+='</details></section>';
  });
  if(!R.areas.length)h+='<div class="card empty"><h2>Sem áreas configuradas</h2><p class="muted">Defina as áreas de atividade na Configuração.</p></div>';
  else h+=resumoAssoc(d,R);
  return h;
}
function resumoAssoc(d,R){
  const nomeA={};d.associacoes.forEach(a=>nomeA[a.id]=a.nome||'Sem nome');
  const grupos={};R.areas.forEach(u=>u.linhas.forEach(l=>{const k=String(l.id).split('~')[0];const g=grupos[u.areaId]=grupos[u.areaId]||{nome:u.areaNome,cor:u.cor,cols:[],m:{}};
    const ck=u.id;if(!g.cols.some(c=>c.id===ck))g.cols.push({id:ck,nome:u.subNome||u.areaNome});
    const r=g.m[k]=g.m[k]||{nome:nomeA[k]||String(l.nome).split(' — ')[0],v:{},n:{},t:0};r.v[ck]=(r.v[ck]||0)+l.total;r.n[ck]=(r.n[ck]||0)+1;r.t+=l.total}));
  const ks=Object.keys(grupos);if(!ks.length)return '';
  const op=S.resOpen&&S.resOpen.has('__assoc');
  let h='<section class="card res-u"><details class="res-f" data-rk="__assoc" ontoggle="resFold(this)" '+(op?'open':'')+'><summary class="ar-h"><h2>Resumo por associação</h2><span class="muted">Total que cada associação recebe, somando todas as suas candidaturas</span></summary>';
  d.areas.forEach(ar=>{const g=grupos[ar.id];if(!g)return;
    const rows=Object.values(g.m).sort((a,b)=>b.t-a.t||a.nome.localeCompare(b.nome,'pt'));const tg=sum(rows,r=>r.t);
    h+='<h3 style="margin:16px 0 8px;display:flex;align-items:center;gap:8px"><span class="dot" style="background:'+esc(g.cor)+'"></span>'+esc(g.nome)+'</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Associação</th>'+g.cols.map(c=>'<th class="n">'+esc(c.nome)+'</th>').join('')+'<th class="n">Total</th><th class="n">% verba total</th></tr></thead><tbody>'+
      rows.map(r=>'<tr><td><b style="font-weight:600">'+esc(r.nome)+'</b></td>'+g.cols.map(c=>'<td class="n">'+(r.v[c.id]!=null?eur(r.v[c.id])+(r.n[c.id]>1?' <small class="muted">('+r.n[c.id]+' cand.)</small>':''):'<span class="muted">—</span>')+'</td>').join('')+'<td class="n"><b>'+eur(r.t)+'</b></td><td class="n">'+pct(R.totais.verba?r.t/R.totais.verba:0)+'</td></tr>').join('')+
      '</tbody><tfoot><tr><td>Total da área</td>'+g.cols.map(c=>'<td class="n">'+eur(sum(rows,r=>r.v[c.id]||0))+'</td>').join('')+'<td class="n">'+eur(tg)+'</td><td class="n">'+pct(R.totais.verba?tg/R.totais.verba:0)+'</td></tr></tfoot></table></div>'});
  return h+'</details></section>';
}

function delta(v){if(Math.abs(v)<0.005)return '<span class="delta eq">=</span>';return '<span class="delta '+(v>0?'up':'down')+'">'+(v>0?'+':'')+eur(v)+'</span>'}
function compTabelas(sims,print){
  const Rs=sims.map(s=>calcular(s.dados));

  let h='<h3 style="margin:4px 0 8px">Parâmetros</h3><div class="tbl-wrap"><table class="tbl"><thead><tr>'+th+'</tr></thead><tbody>'+

    row('Penalizações por critério',d=>condOn(d)?(d.condicoes||[]).filter(c=>c.ativo).map(c=>c.nome+(c.tipo==='niveis'?' (por nível)':' (−'+fmtN(num(c.pct))+' %)')).join('; '):'Não')+
    row('Apoios não financeiros',d=>d.naoFinanceiros&&d.naoFinanceiros.ativo?'Sim ('+d.naoFinanceiros.escaloes.length+' escalões, em '+(nfPct(d)?'%':'pontos')+')':'Não')+
    row('Mínimos (gerais / específicos / final)',d=>pts(d.elegibilidade.minGeral)+' / '+pts(d.elegibilidade.minEspecifico)+' / '+pts(d.elegibilidade.minTotal))+
    row('Pontuação máxima possível',d=>pts(maxGeral(d)+maxEspMax(d)))+
    row('Distribuído',(d,R,i)=>eur(R.totais.distribuido))+row('Por distribuir',(d,R)=>eur(R.totais.porDistribuir))+'</tbody></table></div>';
  const areaNomes=[];Rs.forEach(R=>R.areas.forEach(a=>{if(!areaNomes.includes(a.nome))areaNomes.push(a.nome)}));
  h+='<h3 style="margin:18px 0 8px">Distribuição por área</h3><div class="tbl-wrap"><table class="tbl"><thead><tr>'+th+'</tr></thead><tbody>'+
    areaNomes.map(n=>{const vals=Rs.map(R=>{const a=R.areas.find(x=>x.nome===n);return a?a:null});return '<tr><td>'+esc(n)+'</td>'+vals.map((a,i)=>'<td class="n">'+(a?eur(a.distribuido)+'<span class="muted small" style="display:block">'+fmtN(a.pct)+' % · '+a.N+' eleg.</span>'+(i>0&&vals[0]?delta(a.distribuido-vals[0].distribuido):''):'—')+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>';
  const chaves=[];const mapa=Rs.map(R=>{const m={};R.areas.forEach(a=>{a.linhas.forEach(l=>{const k=String(l.nome).trim().toLowerCase()+'|'+a.nome;m[k]=l.total;if(!chaves.some(c=>c.k===k))chaves.push({k,nome:l.nome,area:a.nome})});a.naoEleg.forEach(l=>{const k=String(l.nome).trim().toLowerCase()+'|'+a.nome;if(!(k in m))m[k]=0;if(!chaves.some(c=>c.k===k))chaves.push({k,nome:l.nome,area:a.nome})})});return m});

    case 'fin.tp':d.finan.tetoPedido=!!v;break;
    case 'fin.tc':d.finan.tetoCusto=d.finan.tetoCusto||{pct:60};d.finan.tetoCusto.on=!!v;break;
    case 'fin.tcpct':d.finan.tetoCusto=d.finan.tetoCusto||{on:true};d.finan.tetoCusto.pct=clamp(num(v),0,100);break;
    case 'fin.exc':d.finan.excedente=v;break;
    case 'x.ped':if(a){const T=(a.extras||[]).find(x=>x.id===k);if(T)T.pedido=v===''?null:Math.max(0,num(v))}break;
    case 'x.cus':if(a){const T=(a.extras||[]).find(x=>x.id===k);if(T)T.custo=v===''?null:Math.max(0,num(v))}break;
    case 'a.ped':if(a){a.fin=a.fin||{};a.fin[k]=a.fin[k]||{};a.fin[k].pedido=v===''?null:Math.max(0,num(v))}break;
    case 'a.cus':if(a){a.fin=a.fin||{};a.fin[k]=a.fin[k]||{};a.fin[k].custo=v===''?null:Math.max(0,num(v))}break;
    case 'limiar.ativo':d.limiar=d.limiar||{subs:{}};d.limiar.ativo=!!v;break;
    case 'limiar.sub':d.limiar=d.limiar||{ativo:true,subs:{}};d.limiar.subs=d.limiar.subs||{};d.limiar.subs[k]=Math.max(0,num(v));break;
    case 'agrupPG':{const p=Math.max(0,num(v));if(p===1)delete d.agrupPG;else d.agrupPG=p;break}
    case 'crit.peso':{const c=d.criterios.find(x=>x.id===k);if(c){const p=Math.max(0,num(v));if(p===1)delete c.peso;else c.peso=p}break}
    case 'el.minGeral':case 'el.minEspecifico':case 'el.minTotal':d.elegibilidade[f.slice(3)]=Math.max(0,num(v));break;
    case 'area.nome':if(ar)ar.nome=v;break;
    case 'usarSub':if(v)ativarSubareas(d,false);else d.usarSubareas=false;break;
    case 'sub.nome':case 'sub.pct':{for(const x of d.areas)for(const s of (x.subareas||[]))if(s.id===k){if(f==='sub.nome')s.nome=v;else s.pct=clamp(num(v),0,100)}break}
    case 'a.cand':if(a){const cur=candidaturas(d,a).map(s=>s.id);const nx=v?cur.concat(cur.includes(k)?[]:[k]):cur.filter(x=>x!==k);const ord=subsDe(d,areaDe(a.areaId)).map(s=>s.id).filter(x=>nx.includes(x));setCands(a,ord)}break;
    case 'area.pct':if(ar)ar.pct=clamp(num(v),0,100);break;
    case 'area.cor':if(ar)ar.cor=v;break;
    case 'a.nome':if(a)a.nome=v;break;
    case 'a.areaId':if(a){a.areaId=v;const ss=subsDe(d,d.areas.find(x=>x.id===v));setCands(a,ss[0]?[ss[0].id]:[])}break;
    case 'a.nif':if(a)a.nif=v;break;
    case 'a.obs':if(a)a.obs=v;break;
    case 'a.excluida':if(a)a.excluida=!!v;break;
    case 'a.motivo':if(a)a.motivo=v;break;
    case 'a.naoFin':if(a)a.naoFin=v===''?null:Math.max(0,num(v));break;
    case 'a.naoFinSub':if(a){if(!a.naoFinSub||typeof a.naoFinSub!=='object'||!Object.keys(a.naoFinSub).length){a.naoFinSub={};candidaturas(d,a).forEach(c=>{if(a.naoFin!=null)a.naoFinSub[c.id]=num(a.naoFin)})}if(v==='')delete a.naoFinSub[k];else a.naoFinSub[k]=Math.max(0,num(v));a.naoFin=sum(Object.values(a.naoFinSub),x=>num(x))}break;
    case 'nf.ativo':d.naoFinanceiros.ativo=!!v;break;
    case 'esc.on':{for(const x of d.areas)for(const sb of (x.subareas||[]))if(sb.id===k){sb.modo=v?'escaloes':'proporcional';if(v&&!(sb.escApoio||[]).length)sb.escApoio=escApoioPadrao()}break}
    case 'esc.min':case 'esc.valor':{const [sid,eid]=k.split('|');for(const x of d.areas)for(const sb of (x.subareas||[]))if(sb.id===sid){const e=(sb.escApoio||[]).find(y=>y.id===eid);if(e)e[f==='esc.min'?'min':'valor']=Math.max(0,num(v))}break}
    case 'cd.ativo':{const c=d.condicoes.find(x=>x.id===k);if(c)c.ativo=!!v;break}
    case 'cd.niv':{const [id,key]=k.split('|');const c=d.condicoes.find(x=>x.id===id);if(c){c.pcts=c.pcts||{};c.pcts[key]=clamp(num(v),0,100)}break}
    case 'cd.pct':{const c=d.condicoes.find(x=>x.id===k);if(c)c.pct=clamp(num(v),0,100);break}
    case 'cd.sub':{const [id,key]=k.split('|');const c=d.condicoes.find(x=>x.id===id);if(c){c.subs=(c.subs||[]).filter(x=>x!==key);if(v)c.subs.push(key)}break}
    case 'nf.ate':{const [key,id]=k.split('|');const e=nfListaMut(d,key).find(x=>x.id===id);if(e)e.ate=Math.max(0,num(v));break}
    case 'nf.porSub':{const n=d.naoFinanceiros;n.porSub=!!v;if(v)n.escaloes.forEach(e=>{e.penSub=e.penSub||{};nfSubNomes(d).forEach(nm=>{if(e.penSub[nfKey(nm)]==null)e.penSub[nfKey(nm)]=num(e.pen)})});break}
    case 'nf.pen':{const [key,id]=k.split('|');const e=nfListaMut(d,key).find(x=>x.id===id);if(e)e.pen=Math.max(0,num(v));break}
    case 'pt':if(a){const T=el.dataset.x?(a.extras||[]).find(x=>x.id===el.dataset.x):a;if(!T)break;T.pontos=T.pontos||{};if(v==='')delete T.pontos[k];else{const s=findSub(k);T.pontos[k]=clamp(num(v),0,s?subMax(s):Infinity)}}break;
    case 'nv':if(a){const T=el.dataset.x?(a.extras||[]).find(x=>x.id===el.dataset.x):a;if(!T)break;T.niveis=T.niveis||{};if(!v)delete T.niveis[k];else T.niveis[k]=v}break;
    case 'x.nome':if(a){const T=(a.extras||[]).find(x=>x.id===k);if(T)T.nome=v}break;
    case 'x.nf':if(a){const T=(a.extras||[]).find(x=>x.id===k);if(T)T.nf=v===''?null:Math.max(0,num(v))}break;
    case 'sim.nome':S.sim.nome=v;break;
    case 'sim.ano':S.sim.ano=v?parseInt(v,10)||null:null;break;
    case 'sim.descricao':S.sim.descricao=v;break;
    default:return false;
  }
  return true;
}
function onField(e){
  const el=e.target;const f=el.dataset&&el.dataset.f;if(!f||el.closest('#modals'))return;
  if(f==='ui.pesquisa'){const q=el.value.trim().toLowerCase();$$('.aitem').forEach(b=>b.hidden=q&&!b.dataset.nome.includes(q));return}
  if(f==='ui.filtroArea'){if(e.type==='change'){S.filtroArea=el.value;render()}return}
  if(!S.sim||bloq())return;
  const discreto=el.tagName==='SELECT'||el.type==='checkbox'||el.type==='radio'||el.type==='color';
  if(e.type==='input'&&discreto)return;
  if(!setF(el))return;
  if(el.type==='range'||el.type==='number')$$('[data-f="'+f+'"]').forEach(o=>{if(o!==el&&(o.dataset.k||'')===(el.dataset.k||''))o.value=el.value});
  marcar();derivados();
  if(e.type==='change'&&el.dataset.r!==undefined)render();
  if(f==='pt'&&e.type==='change'){const a=assocAtual();if(a&&a.pontos[el.dataset.k]!=null)el.value=a.pontos[el.dataset.k]}
  if(f==='a.nome'&&e.type==='change'){const li=$('.aitem.on');if(li)li.dataset.nome=String(el.value).toLowerCase()}
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);

/* ===================== Operações de simulação ===================== */
async function abrir(id,inicial){
  if(S.dirty)await guardar();
  carregando(true);
  try{const r=await rpc('obter_simulacao',{p_codigo:S.codigo,p_id:id});r.dados=normaliza(r.dados);S.sim=r;S.assocSel=null;S.abertos.clear();S.filtroArea='';S.dirty=false;S.save='ok';S.savedAt=null;
    store.set('ultima_sim',id,localStorage);S.modulo=inicial?S.modulo:'config';const nU=bloq()?0:uniGerais(r.dados);render();if(nU){marcar();toast('Critérios gerais uniformizados em '+nU+' associação(ões): reveja-os na ficha.')}window.scrollTo(0,0);if(!inicial)toast('Simulação «'+r.nome+'» aberta.')}
  catch(e){erro(e)}finally{carregando(false)}
}
async function importarAssociacoes(){
  const d=D();const outras=S.lista.filter(x=>x.id!==S.sim.id);
  if(!outras.length){toast('Não existem outras simulações para importar.');return}
  if(S.dirty)await guardar();
  let fonte=null;
  const norm=s=>String(s||'').trim().toLowerCase();
  const existe=new Set(d.associacoes.map(a=>norm(a.nome)));
  const m=modal({title:'Importar associações',wide:true,body:
    '<label class="field"><span>Simulação de origem</span><select class="inp" id="impSim"><option value="">— Escolher —</option>'+outras.map(x=>'<option value="'+x.id+'">'+esc(x.nome)+(x.ano?' ('+esc(x.ano)+')':'')+' · '+(x.n_associacoes||0)+' associações</option>').join('')+'</select></label>'+
    '<div id="impLista" class="imp-lista"><p class="muted small">Escolha a simulação de onde quer trazer as associações.</p></div>'+
    '<label class="check"><input type="checkbox" id="impPts" checked>Copiar também as pontuações (só dos critérios que existem nesta simulação)</label>'+
    '<label class="check"><input type="checkbox" id="impNF" checked>Copiar o valor dos apoios não financeiros, NIF e observações</label>',
    actions:[{label:'Cancelar'},{label:'Importar selecionadas',cls:'primary',onClick:w=>{
      if(!fonte){toast('Escolha a simulação de origem.','erro');return false}
      const ids=[...w.querySelectorAll('[data-imp]:checked')].map(x=>x.dataset.imp);
      if(!ids.length){toast('Selecione pelo menos uma associação.','erro');return false}
      const pts_=w.querySelector('#impPts').checked,nf=w.querySelector('#impNF').checked;
      const subIds=new Set();d.criterios.forEach(c=>c.subs.forEach(s=>subIds.add(s.id)));
      let n=0,semArea=0;
      fonte.dados.associacoes.filter(a=>ids.includes(a.id)).forEach(src=>{
        const arSrc=(fonte.dados.areas||[]).find(x=>x.id===src.areaId);
        const ar=arSrc&&d.areas.find(x=>norm(x.nome)===norm(arSrc.nome));
        if(!ar)semArea++;
        const ss=subsDe(d,ar);let sub=null;
        if(ss.length){const subSrcNome=((arSrc&&arSrc.subareas)||[]).find(s=>s.id===src.subareaId);sub=(subSrcNome&&ss.find(s=>norm(s.nome)===norm(subSrcNome.nome)))||ss[0]}
        const a={id:uid(),nome:src.nome,areaId:ar?ar.id:'',subareaId:sub?sub.id:null,subareaIds:sub?[sub.id]:[],nif:nf?(src.nif||''):'',obs:nf?(src.obs||''):'',naoFin:nf?(src.naoFin??null):null,naoFinSub:(nf&&sub&&src.naoFinSub&&src.subareaIds&&src.subareaIds.length)?{[sub.id]:num(src.naoFinSub[src.subareaIds[0]])}:undefined,excluida:false,motivo:'',pontos:{},niveis:{}};
        if(pts_){Object.keys(src.niveis||{}).forEach(k=>{if(subIds.has(k)){const s=findSub(k);if(s&&s.niveis.some(l=>l.id===src.niveis[k]))a.niveis[k]=src.niveis[k]}});
          Object.keys(src.pontos||{}).forEach(k=>{if(subIds.has(k))a.pontos[k]=src.pontos[k]})}
        d.associacoes.push(a);n++;
      });
      S.filtroArea='';marcar();render();
      toast(n+' associaç'+(n===1?'ão importada':'ões importadas')+(semArea?' · '+semArea+' sem área correspondente (atribua-a na ficha)':'')+'.');
    }}]});
  const lista=m.querySelector('#impLista');
  const desenhar=()=>{
    const ass=(fonte.dados.associacoes||[]);
    if(!ass.length){lista.innerHTML='<p class="muted small">Esta simulação não tem associações.</p>';return}
    const areas=fonte.dados.areas||[];const grupos={};
    ass.forEach(a=>{const ar=areas.find(x=>x.id===a.areaId);const k=ar?ar.nome:'Sem área';(grupos[k]=grupos[k]||[]).push(a)});
    lista.innerHTML='<div class="imp-top"><label class="check" style="margin:0"><input type="checkbox" id="impTodas">Selecionar todas as novas</label><span class="muted small">As que já existem nesta simulação (mesmo nome) ficam desmarcadas.</span></div>'+
      Object.keys(grupos).sort((x,y)=>x.localeCompare(y,'pt')).map(g=>'<div class="imp-g"><div class="kicker">'+esc(g)+'</div>'+grupos[g].sort((x,y)=>String(x.nome).localeCompare(String(y.nome),'pt')).map(a=>{const dup=existe.has(norm(a.nome));
        return '<label class="imp-i'+(dup?' dup':'')+'"><input type="checkbox" data-imp="'+a.id+'" '+(dup?'':'checked')+'><span>'+esc(a.nome)+'</span>'+(dup?'<small>já existe</small>':'')+'</label>'}).join('')+'</div>').join('');
    const t=lista.querySelector('#impTodas');t.checked=true;t.onchange=()=>lista.querySelectorAll('.imp-i:not(.dup) [data-imp]').forEach(x=>x.checked=t.checked);
  };
  m.querySelector('#impSim').onchange=async e=>{const id=e.target.value;fonte=null;if(!id){lista.innerHTML='';return}
    lista.innerHTML='<p class="muted small">A carregar…</p>';
    try{const r=await rpc('obter_simulacao',{p_codigo:S.codigo,p_id:id});r.dados=normaliza(r.dados);fonte=r;desenhar()}catch(err){lista.innerHTML='';erro(err)}};
}
async function novaSimulacao(){
  const ano=new Date().getFullYear()+1;
  const o=await formulario('Nova simulação',[{k:'nome',label:'Nome',valor:'Simulação '+ano,obrig:true},{k:'ano',label:'Ano',tipo:'number',valor:ano},{k:'descricao',label:'Descrição (opcional)',valor:''},
    {k:'base',label:'Ponto de partida',tipo:'radio',valor:'modelo',opcoes:[{v:'modelo',t:'Modelo de referência (Anexo IV)',d:'Cinco áreas, critérios gerais e específicos, parcela fixa 20 % e limite de 25 %.'},{v:'vazio',t:'Em branco',d:'Cinco áreas sem critérios, para construir uma grelha nova.'}]},
    {k:'estrutura',label:'Estrutura das áreas',tipo:'radio',valor:'simples',opcoes:[{v:'simples',t:'Áreas simples (modelo atual)',d:'Cada área é distribuída como um todo.'},{v:'sub',t:'Áreas com sub-áreas',d:'Ex.: Desportiva → Permanente / Pontual; Social → Emergência / Outras respostas. Os critérios específicos atuais passam para Permanente; Pontual recebe critérios próprios.'}]}],'Criar simulação');
  if(!o)return;
  if(S.dirty)await guardar();
  carregando(true);
  try{const dados=o.base==='vazio'?dadosVazios():modeloReferencia();if(o.estrutura==='sub')ativarSubareas(dados,o.base!=='vazio');
    const r=await rpc('guardar_simulacao',{p_codigo:S.codigo,p_id:null,p_nome:o.nome.trim(),p_descricao:o.descricao||null,p_ano:parseInt(o.ano,10)||null,p_dados:dados,p_resultados:calcular(dados)});
    atualizarLista(r);r.dados=normaliza(r.dados);S.sim=r;S.assocSel=null;S.abertos.clear();S.dirty=false;store.set('ultima_sim',r.id,localStorage);S.modulo='config';render();toast('Simulação criada.')}
  catch(e){erro(e)}finally{carregando(false)}
}
async function duplicar(id){
  const orig=S.lista.find(x=>x.id===id);
  const o=await formulario('Duplicar cenário',[{k:'nome',label:'Nome do novo cenário',valor:(orig?orig.nome:'Simulação')+' (cópia)',obrig:true}],'Duplicar');
  if(!o)return;
  if(S.dirty)await guardar();
  carregando(true);
  try{const r=await rpc('duplicar_simulacao',{p_codigo:S.codigo,p_id:id,p_nome:o.nome.trim()});atualizarLista(r);carregando(false);await abrir(r.id,true);toast('Cenário duplicado e aberto. O original não foi alterado.')}
  catch(e){erro(e)}finally{carregando(false)}
}
async function apagar(id){
  const x=S.lista.find(s=>s.id===id);
  if(!await confirmar('Apagar simulação','Apagar definitivamente a simulação «'+esc(x?x.nome:'')+'»? Esta operação não pode ser anulada.','Apagar',true))return;
  carregando(true);
  try{await rpc('apagar_simulacao',{p_codigo:S.codigo,p_id:id});S.lista=S.lista.filter(s=>s.id!==id);S.compSel.delete(id);if(S.comp)S.comp=S.comp.filter(s=>s.id!==id);if(S.comp&&S.comp.length<2)S.comp=null;
    if(S.sim&&S.sim.id===id){S.sim=null;S.dirty=false;store.set('ultima_sim',null,localStorage)}render();toast('Simulação apagada.')}
  catch(e){erro(e)}finally{carregando(false)}
}
async function bloquear(id,val){
  if(val&&S.dirty){const ok=await guardar();if(!ok)return}
  if(!val&&!await confirmar('Desbloquear simulação','Ao desbloquear, os parâmetros e pontuações desta simulação voltam a poder ser alterados. Se pretende manter este cenário intacto, duplique-o em vez de o desbloquear.','Desbloquear'))return;
  carregando(true);
  try{const r=await rpc('definir_bloqueio',{p_codigo:S.codigo,p_id:id,p_bloqueada:val});S.sim.bloqueada=r.bloqueada;atualizarLista(r);render();toast(val?'Simulação bloqueada.':'Simulação desbloqueada.')}
  catch(e){erro(e)}finally{carregando(false)}
}
async function comparar(){
  if(S.dirty)await guardar();
  carregando(true);
  try{const ids=S.lista.filter(x=>S.compSel.has(x.id)).map(x=>x.id).reverse();
    const sims=await Promise.all(ids.map(id=>rpc('obter_simulacao',{p_codigo:S.codigo,p_id:id})));
    sims.forEach(s=>s.dados=normaliza(s.dados));S.comp=sims;render();
    setTimeout(()=>{const c=$$('.card').pop();c&&c.scrollIntoView({behavior:'smooth',block:'start'})},60)}
  catch(e){erro(e)}finally{carregando(false)}
}
async function alterarCodigo(){
  const o=await formulario('Alterar código de acesso',[{k:'atual',label:'Código atual',tipo:'password',obrig:true},{k:'novo',label:'Novo código (mínimo 6 caracteres)',tipo:'password',obrig:true},{k:'conf',label:'Confirmar novo código',tipo:'password',obrig:true}],'Alterar código');
  if(!o)return;
  if(o.novo!==o.conf){toast('A confirmação não coincide com o novo código.','erro');return}
  if(o.novo.length<6){toast('O novo código deve ter pelo menos 6 caracteres.','erro');return}
  carregando(true);
  try{await rpc('alterar_codigo',{p_codigo:o.atual,p_novo:o.novo});S.codigo=o.novo;store.set('codigo',o.novo);toast('Código de acesso alterado.')}
  catch(e){toast(e.code==='28000'?'O código atual não está correto.':e.message,'erro')}finally{carregando(false)}
}
async function sair(forcado){
  if(!forcado&&S.dirty)await guardar();
  store.set('codigo',null);location.reload();
}

/* ===================== Arranque ===================== */
async function iniciar(){
  $('#login').hidden=true;$('#app').hidden=false;
  carregando(true);
  try{await carregarLista()}catch(e){carregando(false);erro(e);return}
  carregando(false);
  const ult=store.get('ultima_sim',localStorage);
  if(ult&&S.lista.some(x=>x.id===ult)){S.modulo='res';await abrir(ult,true)}else{S.modulo='sim';render()}
}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const c=$('#loginCode').value;const btn=$('#loginBtn');$('#loginErr').textContent='';btn.disabled=true;btn.textContent='A verificar…';
  try{const ok=await rpc('verificar_codigo',{p_codigo:c});if(!ok){$('#loginErr').textContent='Código de acesso inválido.';$('#loginCode').select();return}
    S.codigo=c;store.set('codigo',c);await iniciar()}
  catch(err){$('#loginErr').textContent='Não foi possível ligar ao servidor. Verifique a ligação à internet.'}
  finally{btn.disabled=false;btn.textContent='Entrar'}
});
window.addEventListener('beforeunload',e=>{if(S.dirty||S.saving){guardar();e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&S.dirty)guardar()});
(async()=>{
  const c=store.get('codigo');
  if(c){try{if(await rpc('verificar_codigo',{p_codigo:c})){S.codigo=c;await iniciar();return}}catch(e){}store.set('codigo',null)}
  $('#login').hidden=false;setTimeout(()=>$('#loginCode').focus(),50);
})();
